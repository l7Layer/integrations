<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="paperless:epd-optimize" content='{"intent":"natural"}'>
  <title>NAS Photos</title>
  <link rel="stylesheet" href="/assets/paperless.css">
  <script src="/assets/paperless.iife.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    main { width: 100vw; height: 100vh; display: grid; place-items: center; background: #111; color: #fff; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
    #empty { padding: 2rem; text-align: center; font: 600 clamp(1.2rem, 3vw, 2rem)/1.3 system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="website-has-loading-element"></div>
  <main id="screen"><div id="empty">Waiting for the first photo from your Mac…</div></main>
  <script>
    (async () => {
      const api = window.PaperlessOpenIntegration;
      const { waitForPayload, markReady, markError } = api;
      try {
        const payload = await waitForPayload({ timeoutMs: 500 });
        const content = payload?.integrationContent;
        const screen = document.getElementById("screen");
        if (content?.imageUrl) {
          const image = new Image();
          image.alt = "Photo from NAS";
          image.src = content.imageUrl;
          image.style.cssText = "width:100%;height:100%;object-fit:contain;object-position:center;display:block";
          await image.decode();
          screen.replaceChildren(image);
        } else {
          document.getElementById("empty").textContent = "No photo has been uploaded yet. Start the NAS Photos uploader on your Mac.";
        }
        markReady?.({ revision: content?.revision || null });
      } catch (error) {
        markError?.(error);
        document.getElementById("empty").textContent = "NAS Photos could not load: " + (error?.message || "Unknown error");
      }
    })();
  </script>
</body>
</html>
