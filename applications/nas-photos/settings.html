<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAS Photos connection</title>
<style>
  body{font:16px/1.45 system-ui,sans-serif;color:#202124;margin:0;padding:18px}
  h2{font-size:20px;margin:0 0 8px} p{color:#60656f;margin:0 0 16px}
  button{border:0;border-radius:8px;background:#202124;color:white;padding:12px 18px;font:600 15px system-ui;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  #status{margin-top:14px;white-space:pre-wrap}
</style>
</head>
<body>
  <h2>NAS Photos</h2>
  <p>Connect this Paper to the NAS Photos publisher. Your Mac will upload photos to this Paper. The connection credentials stay on the integration backend.</p>
  <button id="connect" disabled>Waiting for Paper…</button>
  <div id="status" role="status"></div>
<script>
(() => {
  const button = document.getElementById("connect");
  const status = document.getElementById("status");
  let hostWindow = null;
  let hostOrigin = null;
  let paperId = null;
  let pendingId = null;

  function trustedOrigin(origin) {
    try {
      const url = new URL(origin);
      return url.protocol === "https:" &&
        (url.hostname === "paperlesspaper.de" || url.hostname.endsWith(".paperlesspaper.de"));
    } catch { return false; }
  }

  window.addEventListener("message", async (event) => {
    if (event.source !== window.parent || !trustedOrigin(event.origin)) return;
    const message = event.data;
    if (!message || message.source !== "paperlesspaper-app") return;

    if (message.type === "INIT") {
      hostWindow = event.source;
      hostOrigin = event.origin;
      paperId = message.payload?.paper?.id || null;
      button.disabled = !paperId;
      button.textContent = paperId ? "Connect to PaperlessPaper" : "Save this Paper first";
      return;
    }

    if (message.type === "CONNECTION_GRANT" && message.payload?.requestId === pendingId) {
      pendingId = null;
      button.disabled = false;
      if (!message.payload.grant) {
        status.textContent = message.payload.error || "Connection request failed.";
        return;
      }
      button.disabled = true;
      status.textContent = "Securing connection…";
      try {
        const response = await fetch("./api/connect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ grant: message.payload.grant })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Connection failed");
        status.textContent = "Connected to " + (result.name || "this Paper") + ". You can now upload photos from your Mac.";
        button.textContent = "Connected";
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    }
  });

  button.addEventListener("click", () => {
    if (!hostWindow || !hostOrigin || !paperId || pendingId) return;
    pendingId = crypto.randomUUID();
    status.textContent = "Requesting a secure connection…";
    button.disabled = true;
    hostWindow.postMessage({
      source: "paperlesspaper-plugin",
      type: "REQUEST_CONNECTION",
      payload: { requestId: pendingId }
    }, hostOrigin);
  });

  window.parent.postMessage({
    source: "paperlesspaper-plugin",
    type: "SET_HEIGHT",
    payload: { height: document.documentElement.scrollHeight }
  }, "*");
})();
</script>
</body>
</html>
